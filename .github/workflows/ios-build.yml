name: iOS AdHoc Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'Resources/**'
      - 'project.yml'
      - '.github/workflows/ios-build.yml'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Prepare signing materials
        env:
          DH_DIST_P12_B64: ${{ secrets.DH_DIST_P12_B64 }}
          DH_P12_PASS: ${{ secrets.DH_P12_PASS }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          printf '%s' "$DH_DIST_P12_B64" | base64 --decode -o /tmp/dh_dist.p12
          printf '%s' "$ASC_KEY_P8_B64" | base64 --decode -o /tmp/AuthKey.p8
          KC="$HOME/Library/Keychains/dhbuild.keychain"
          security delete-keychain dhbuild.keychain 2>/dev/null || true
          security create-keychain -p dhbuild2026 "$KC"
          security list-keychains -s "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p dhbuild2026 "$KC"
          if security import /tmp/dh_dist.p12 -k "$KC" -P "$DH_P12_PASS" \
              -T /usr/bin/codesign -T /usr/bin/xcodebuild 2>/dev/null; then
            echo "p12 import OK"
          else
            echo "p12 import failed (PBES2), fallback to PEM import"
            openssl pkcs12 -in /tmp/dh_dist.p12 -nocerts -nodes -passin pass:"$DH_P12_PASS" -out /tmp/dh_key.pem
            openssl pkcs12 -in /tmp/dh_dist.p12 -nokeys -passin pass:"$DH_P12_PASS" -out /tmp/dh_cert.pem
            security import /tmp/dh_key.pem -k "$KC" -T /usr/bin/codesign -T /usr/bin/xcodebuild
            security import /tmp/dh_cert.pem -k "$KC"
          fi
          security set-key-partition-list -S apple-tool:,apple: -k dhbuild2026 "$KC" > /dev/null
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "== find-identity =="
          security find-identity -v -p codesigning "$KC" || true

      - name: Archive (compile + manual sign)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project DebateHub.xcodeproj \
            -scheme DebateHub \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath /tmp/dh.xcarchive \
            CODE_SIGN_STYLE=Manual \
            -allowProvisioningUpdates \
            -authenticationKeyPath /tmp/AuthKey.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="DebateHub AdHoc" \
            DEVELOPMENT_TEAM=978G2M54F7 \
            PRODUCT_BUNDLE_IDENTIFIER=com.debatehub.bianlun

      - name: Pack Ad Hoc ipa
        run: |
          APP_PATH=$(ls -d /tmp/dh.xcarchive/Products/Applications/*.app | head -1)
          mkdir -p /tmp/ipa/Payload
          cp -R "$APP_PATH" /tmp/ipa/Payload/
          cd /tmp/ipa && zip -qry bianlun.ipa Payload
          cp bianlun.ipa "$GITHUB_WORKSPACE/"

      - name: Verify ipa contents
        run: |
          unzip -l bianlun.ipa | head -20
          echo "== version =="
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /tmp/ipa/Payload/DebateHub.app/Info.plist || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' /tmp/ipa/Payload/DebateHub.app/Info.plist || true

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: bianlun-ipa
          path: bianlun.ipa
          retention-days: 30
