# Codemagic 云构建配置（DebateHub 原生 iOS）
# 签名方案 v3：纯手动签名（不依赖 Codemagic 签名集成 / 不访问苹果网络）
#   - 分发证书 + 私钥：内联 DH_DIST_P12_B64（构建时导入临时钥匙串）
#   - 描述文件：DebateHub AdHoc v2（已在苹果后台生成，含测试设备）
#   - Bundle ID：com.debatehub.bianlun

workflows:
  ios-adhoc:
    name: DebateHub iOS (Ad Hoc)
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        DEVELOPMENT_TEAM: 978G2M54F7
        DH_P12_PASS: debatehub2026
        DH_DIST_P12_B64: ""
    scripts:
      - name: 安装 XcodeGen 并生成工程
        script: |
          brew install xcodegen
          cd $CM_BUILD_DIR
          xcodegen generate
      - name: 配置签名材料（临时钥匙串 + 导入 p12）
        script: |
          echo "$DH_DIST_P12_B64" | base64 --decode > /tmp/dh_dist.p12
          KC="$HOME/Library/Keychains/dhbuild.keychain"
          security delete-keychain dhbuild.keychain 2>/dev/null || true
          security create-keychain -p dhbuild2026 "$KC"
          security list-keychains -s "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p dhbuild2026 "$KC"
          security import /tmp/dh_dist.p12 -k "$KC" -P debatehub2026 \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -k dhbuild2026 "$KC" > /dev/null
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
      - name: Archive（编译 + 手动签名）
        script: |
          cd $CM_BUILD_DIR
          xcodebuild archive \
            -project DebateHub.xcodeproj \
            -scheme DebateHub \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath /tmp/dh.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="DebateHub AdHoc v2" \
            DEVELOPMENT_TEAM=978G2M54F7 \
            PRODUCT_BUNDLE_IDENTIFIER=com.debatehub.bianlun
      - name: 打包 Ad Hoc ipa
        script: |
          APP_PATH=$(ls -d /tmp/dh.xcarchive/Products/Applications/*.app | head -1)
          mkdir -p /tmp/ipa/Payload
          cp -R "$APP_PATH" /tmp/ipa/Payload/
          cd /tmp/ipa && zip -qry bianlun.ipa Payload
          cp bianlun.ipa "$CM_BUILD_DIR/"
    publishing:
      email:
        recipients:
          - guanht@china-yida.com
