# Codemagic 云构建配置（DebateHub 原生 iOS）
# 签名方案：xcodebuild -allowProvisioningUpdates 自动管理
#   需在 Codemagic 应用设置 → Environment variables 添加一个变量：
#     ASC_KEY_P8_B64 = .p8 私钥文件的 base64 内容（标记 secure）
#   （Key ID / Issuer ID 已内置在下方 vars，如换密钥记得同步修改）
# 注意：旧 ios_signing 集成已移除——Developer 角色密钥无权建证书，
#       改由构建机用 API 密钥自动完成全部签名（注册 BundleID/描述文件/证书）。

workflows:
  ios-adhoc:
    name: DebateHub iOS (Ad Hoc)
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        ASC_KEY_ID: 46A63N3755
        ASC_ISSUER_ID: 69a6de8b-b3a9-47e3-e053-5b8c7c11a4d1
        DEVELOPMENT_TEAM: 978G2M54F7
    scripts:
      - name: 安装 XcodeGen 并生成工程
        script: |
          brew install xcodegen
          cd $CM_BUILD_DIR
          xcodegen generate
      - name: 写入 ASC 签名密钥
        script: |
          echo "$ASC_KEY_P8_B64" | base64 --decode > "$CM_BUILD_DIR/AuthKey.p8"
          wc -c "$CM_BUILD_DIR/AuthKey.p8"
      - name: Archive（编译 + 自动签名）
        script: |
          cd $CM_BUILD_DIR
          xcodebuild archive \
            -project DebateHub.xcodeproj \
            -scheme DebateHub \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath /tmp/dh.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$CM_BUILD_DIR/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM
      - name: 导出 Ad Hoc ipa
        script: |
          cd $CM_BUILD_DIR
          cat > /tmp/exportOptions.plist <<'PL'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>978G2M54F7</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PL
          xcodebuild -exportArchive \
            -archivePath /tmp/dh.xcarchive \
            -exportOptionsPlist /tmp/exportOptions.plist \
            -exportPath "$CM_BUILD_DIR/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$CM_BUILD_DIR/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
    publishing:
      email:
        recipients:
          - guanht@china-yida.com
